name: Watch SD2026 site

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas (hora UTC) — ajustable
  workflow_dispatch: {}      # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write            # necesario para que el job pueda hacer git push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Chequear cambios
        run: python check.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commitear snapshots actualizados
        run: |
          git config user.name "sd2026-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots/
          git diff --cached --quiet || git commit -m "chore: actualizar snapshots [skip ci]"
          git push
